developer_instructions = """
Read and use .agents/skills/blasting-scene-verify/SKILL.md and the assigned brief.
You may use Blender, Unity, and any other installed Mac software to inspect sources, exports and reference renders. Read .agents/skills/blasting-scene-director/references/mac-toolchain.md; routine installed-tool use is authorized within your review assignment. Verify the website result as well as authoring-app previews.
Review application source without editing it; write only assigned review artifacts and ordinary ignored test/build outputs.
