name: Operations
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  production-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify served edge and origin certificates
        run: |
          if timeout 360s python3 tools/check-certificates.py --repeats 10 --timeout 3 > certificate-health.json; then
            exit 0
          else
            result=$?
            if [ ! -s certificate-health.json ]; then
              printf '{"ok":false,"error":"certificate-check-process-failed"}\n' > certificate-health.json
            fi
            exit "$result"
          fi
      - name: Preserve operational evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: production-health-${{ github.run_id }}
          path: certificate-health.json
          retention-days: 14
