name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    concurrency:
      group: quality-job-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Unit tests and asset integrity
        run: npm test && npm run test:certificates && npm run assets:verify
      - name: Build production site
        run: npm run build
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser regressions
        run: npx playwright test --project=chromium --project=node-webgl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  webkit:
    name: webkit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: webkit-failure-evidence
          path: test-results/
          retention-days: 7
  release-quality:
    name: release-quality
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful validation of the merged main SHA
        env:
          CHROMIUM_RESULT: ${{ needs.quality.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: test "$CHROMIUM_RESULT" = success && test "$WEBKIT_RESULT" = success
