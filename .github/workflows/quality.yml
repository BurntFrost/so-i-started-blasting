name: Essential checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Cancel superseded browser work together; summaries still fail closed.
concurrency:
  group: essentials-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-core:
    name: Build & assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Unit tests and asset integrity
        run: npm test && npm run test:certificates && npm run assets:verify
      - name: Build production site
        run: npm run build
  chromium:
    name: Browser controls (Chromium + WebGL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Essential controls, scene loading and authored-mesh regression
        run: npx playwright test --project=chromium --project=node-webgl --grep @essential --workers=1 --max-failures=1
      - name: Preserve browser failure evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: chromium-essential-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  webkit:
    name: Browser controls (WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - name: Essential Safari-engine controls and scene loading
        run: npx playwright test --project=webkit --grep @essential --workers=1 --max-failures=1
      - name: Preserve browser failure evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: webkit-essential-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  quality:
    # Keep this check name: GitHub main branch protection requires it.
    name: quality
    if: always()
    needs: [quality-core, chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every essential check to succeed
        env:
          CORE_RESULT: ${{ needs.quality-core.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: test "$CORE_RESULT" = success && test "$CHROMIUM_RESULT" = success && test "$WEBKIT_RESULT" = success
  release-quality:
    # Keep this check name: Vercel imports it to gate production domain assignment.
    name: release-quality
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require essential checks for the main commit before publication
        env:
          ESSENTIAL_RESULT: ${{ needs.quality.result }}
        run: test "$ESSENTIAL_RESULT" = success
