name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-core:
    name: quality-core
    concurrency:
      group: quality-job-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Unit tests and asset integrity
        run: npm test && npm run test:certificates && npm run assets:verify
      - name: Build production site
        run: npm run build
  chromium:
    name: chromium-${{ matrix.shard }}
    concurrency:
      group: chromium-${{ matrix.shard }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      # Sharded because the suite shares one browser process (workers: 1), and swiftshader
      # does not return a destroyed context's host allocations. --fully-parallel moves
      # sharding from file to test granularity; one file would otherwise land in shard 1.
      # The ULTRA 4K spec runs in chromium-ultra instead: it is the heaviest spec and the
      # only one that needs a process nothing else has touched.
      - run: npx playwright test --project=chromium --grep-invert "desktop ULTRA" --fully-parallel --workers=1 --shard=${{ matrix.shard }}/3 --max-failures=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: chromium-${{ matrix.shard }}-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  chromium-ultra:
    name: chromium-ultra
    concurrency:
      group: chromium-ultra-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      # The ULTRA spec holds three separate 4K assets and the full post chain at 2560x1600
      # under swiftshader, so every one of those 4.1M pixels is CPU work. It takes 8.9s on a
      # real GPU and has never finished inside the global 180s budget here, so its true cost
      # is still unmeasured. Run it alone, with room to finish, and let the reporter print
      # the duration: that number decides whether the spec needs a calibrated timeout like
      # the node-* projects already carry, or has to be split.
      - run: npx playwright test --project=chromium --grep "desktop ULTRA" --timeout=600000 --reporter=list --max-failures=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: chromium-ultra-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native-webgl:
    name: native-webgl-${{ matrix.shard }}
    concurrency:
      group: native-webgl-${{ matrix.shard }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test --project=node-webgl --fully-parallel --workers=1 --shard=${{ matrix.shard }}/4 --max-failures=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: native-webgl-${{ matrix.shard }}-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  quality:
    name: quality
    if: always()
    needs: [quality-core, chromium, chromium-ultra, native-webgl]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require core, every chromium shard, ULTRA and all native fallback checks
        env:
          CORE_RESULT: ${{ needs.quality-core.result }}
          CHROMIUM_RESULT: ${{ needs.chromium.result }}
          ULTRA_RESULT: ${{ needs.chromium-ultra.result }}
          NATIVE_RESULT: ${{ needs.native-webgl.result }}
        run: test "$CORE_RESULT" = success && test "$CHROMIUM_RESULT" = success && test "$ULTRA_RESULT" = success && test "$NATIVE_RESULT" = success
  webkit:
    name: webkit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: webkit-failure-evidence
          path: test-results/
          retention-days: 7
  release-quality:
    name: release-quality
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful validation of the merged main SHA
        env:
          CHROMIUM_RESULT: ${{ needs.quality.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
        run: test "$CHROMIUM_RESULT" = success && test "$WEBKIT_RESULT" = success
