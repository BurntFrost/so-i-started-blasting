name: Release
on:
  repository_dispatch:
    types: [vercel.deployment.ready]
permissions:
  contents: read
jobs:
  hosted-smoke:
    if: >-
      github.event.action == 'vercel.deployment.ready' &&
      github.event.sender.id == 35613825 &&
      github.event.client_payload.project.id == 'prj_t9xPKJ22rXL1adwZON1A1FH4pWr6' &&
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.git.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      id-token: write
    steps:
      # repository_dispatch executes the workflow from main. Never check out a payload PR ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Verify the immutable deployment and report on its SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/check-deployment.mjs ready > release-ready.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-ready-${{ github.event.client_payload.id }}
          path: release-ready.json
          retention-days: 30
